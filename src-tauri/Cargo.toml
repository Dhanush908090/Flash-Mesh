[package]
name = "flashmesh"
version = "0.1.0"
description = "FlashMesh — A blazing-fast cross-platform file manager"
authors = ["you"]
edition = "2021"

[lib]
name = "flashmesh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
chrono         = { version = "0.4", features = ["serde", "clock"] }
dirs           = "5"
walkdir        = "2"
fs2            = "0.4"
once_cell = "1.21.4"
base64         = "0.22"
image          = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash          = "5"
sysinfo        = { version = "0.32", features = ["disk"] }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

